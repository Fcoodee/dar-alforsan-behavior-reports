<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14577a">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>تقارير الأداء السلوكي والأكاديمي — دار الفرسان (نسخة تجريبية)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16222d;--mut:#4a5b69;--line:#d3dce3;--bg:#eef2f5;--pri:#1b6a96;--ok:#1d4a2c;--warn:#5c4306;--info:#123a5c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;--sc:.78}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-family:'Tajawal','Segoe UI','SF Arabic','Noto Sans Arabic',Roboto,'Helvetica Neue',Tahoma,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#app{padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-right:max(16px,env(safe-area-inset-right));padding-left:max(16px,env(safe-area-inset-left));padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
header.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:21px;font-weight:800}
.sub{color:var(--mut);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.c1{flex:1 1 280px;max-width:300px;min-width:260px;display:flex;flex-direction:column;gap:12px}
.c2{flex:1 1 360px;max-width:420px;min-width:320px;display:flex;flex-direction:column;gap:12px}
.c3{flex:999 1 500px;min-width:300px;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #9fb0bd;background:#fff;font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.chip{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;border:1px solid #9fb0bd;background:#fff;padding:2px 4px}
.chip b{font-size:13.5px;line-height:1.35;text-align:center}.chip small{font-size:12px}
.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.list{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.st{min-height:48px;text-align:right;border-radius:8px;border:1px solid #c3cfd8;background:#fff;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px}
.st .gc{background:#eaf3f9;color:#14425f;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st small{flex-basis:100%}
.st.sel{background:#d6e6f4;border-color:var(--pri)}
.st small{color:#3d4e5c;font-size:12.5px}
fieldset{margin:0;border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
legend{font-weight:800;padding:0 6px;font-size:14px}
.fs-s{border:1px solid #b9d3bf;background:#f6fbf7}.fs-s legend{color:var(--ok)}
.fs-i{border:1px solid #e3cf9a;background:#fffaf0}.fs-i legend{color:var(--warn)}
.fs-r{border:1px solid #b4cde3;background:#f4f9fd}.fs-r legend{color:var(--info)}
.opts{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px}
label.o{min-height:36px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:4px 2px}
label.o input{width:18px;height:18px;margin-top:2px;flex:none}
.add{display:flex;gap:8px}.add input{flex:1;min-width:0;min-height:44px;border:1px solid #9fb0bd;border-radius:8px;padding:0 12px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#e3eaf0}
.b-DRAFT{background:#e3eaf0}.b-SUBMITTED{background:#fbecc8;color:var(--warn)}.b-REVIEWED{background:#d6e6f4;color:var(--info)}.b-APPROVED{background:#dcecdc;color:var(--ok)}.b-PUBLISHED{background:#1d4a2c;color:#fff}
.bar{height:10px;border-radius:5px;background:#dbe4ea;overflow:hidden}.bar i{display:block;height:10px;background:var(--pri)}
#msg{min-height:22px;font-size:13.5px;font-weight:700}
#msg.err{color:#a02020}#msg.ok{color:var(--ok)}
.wrap{width:100%;overflow-x:auto;display:flex;justify-content:center}
.scaled{position:relative;flex:none;width:calc(794px*var(--sc));height:calc(1123px*var(--sc));box-shadow:0 2px 14px rgba(22,34,45,.25);background:#fff}
.scaled .sheet{position:absolute;top:0;right:0;-webkit-transform:scale(var(--sc));transform:scale(var(--sc));-webkit-transform-origin:top right;transform-origin:top right}
dialog{border:1px solid var(--line);border-radius:10px;max-width:760px;width:92%}
table.au{border-collapse:collapse;width:100%;font-size:12.5px}table.au td,table.au th{border:1px solid var(--line);padding:4px 8px;text-align:right}


header.hero{position:relative;overflow:hidden;border-radius:14px;background:#14577a;color:#fff;padding:20px 24px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;border-bottom:6px solid #7cc4e4}
header.hero .emb{position:absolute;left:-40px;bottom:-70px;width:520px;opacity:.1;pointer-events:none}
header.hero>*{position:relative}header.hero>.emb{position:absolute}
.hero .logo{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:center}
.hero .logo img{width:112px;height:94px;object-fit:contain}
.hero .dwl{display:flex;align-items:center;padding-inline-start:20px;border-inline-start:2px solid rgba(255,255,255,.55)}
.hero .dwl img{height:86px;width:auto;max-width:120px;object-fit:contain;filter:brightness(0) invert(1);opacity:.96}
.hero .tt{display:flex;flex-direction:column;gap:8px;flex:1 1 320px}
.hero h1{font-size:28px;color:#fff}
.hero .chip2{display:inline-block;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45)}
.hero .chip2.w{background:#fff;color:#14577a;font-weight:800;border-color:#fff}
.hero .sub2{font-size:14.5px;color:#d6ecf7}
.hero .prog{display:flex;flex-direction:column;gap:8px;min-width:260px;flex:0 1 340px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px}
.hero .prog .bar{background:rgba(255,255,255,.28)}.hero .prog .bar i{background:#bfe6f7}
.hero .clk{display:flex;flex-wrap:wrap;gap:8px 10px;font-size:13.5px}
.hero .clk span{background:rgba(0,0,0,.22);border-radius:8px;padding:4px 12px}
.hero .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero .ctl .badge{background:rgba(255,255,255,.2);color:#fff}
.hero .ctl select,.hero .ctl .btn{color:var(--ink)}
.hero .ctl label{color:#d6ecf7}


.ub{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.uc{text-align:right;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.uc.sel{border-color:var(--pri);box-shadow:0 0 0 2px #1b6a9633;background:#eaf3f9}
.uc .un{font-weight:800;font-size:14px}.uc .ur{font-size:12px;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pl{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid #c3cfd8;background:#f4f7f9}
.pl b{font-size:13px}.pl.ok{background:#dcecdc;border-color:#b9d3bf;color:#1d4a2c}.pl.act{background:#fbecc8;border-color:#e3cf9a;color:#5c4306}
.dash{display:flex;flex-direction:column;gap:10px}.dmsg{margin:0;font-size:15px}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}.dt th,.dt td{border:1px solid var(--line);padding:6px 10px;text-align:center}.dt thead th{background:#eef3f6}.dt tbody th{text-align:right;background:#f7f9fa}.dt tr.tot td,.dt tr.tot th{font-weight:800;background:#eef3f6}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e3eaf0}.sbar i{display:block;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}

.lg{max-width:860px;margin:48px auto;display:flex;flex-wrap:wrap;gap:24px;border-top:6px solid #14577a;padding:22px}
.lg-info{flex:1 1 380px;display:flex;flex-direction:column;gap:12px}
.lg-form{flex:1 1 280px;display:flex;flex-direction:column;gap:10px;background:#f4f8fb;border:1px solid var(--line);border-radius:12px;padding:16px}
.lg-form{align-self:flex-start}.lg-form label{display:flex;flex-direction:column;gap:6px}
.lg-p{margin:0;line-height:1.9;font-size:14.5px}.lg-h{font-weight:800;font-size:14px;color:#14577a;border-bottom:1px solid var(--line);padding-bottom:4px}
.rl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.7}.rt{align-self:flex-start;border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px}

/* ───── التجاوب: حاسوب ≥1200 · لوحي 768–1199 · جوال <768 ───── */
@media (max-width:1199px){
 .c1{flex:1 1 300px;max-width:none}.c2{flex:1 1 380px;max-width:none}.c3{flex:1 1 100%}
 .ub{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media (max-width:767px){
 body{font-size:16px}
 #app{gap:12px}
 .c1,.c2,.c3{flex:1 1 100%;max-width:none;min-width:0;width:100%}
 header.hero{padding:14px 14px 18px;gap:12px}
 .hero h1{font-size:21px}
 .hero .logo img{width:76px;height:64px}
 .hero .tt{flex:1 1 100%}
 .hero .prog{min-width:0;flex:1 1 100%}
 .hero .emb{width:360px;left:-60px}
 .hero .ctl .btn,.hero .ctl .badge{flex:0 0 auto}
 .list{max-height:260px}
 .opts{max-height:200px}
 input,select,textarea{font-size:16px!important}
 .ub{grid-template-columns:1fr 1fr}
 .dt{font-size:12px}.dt th,.dt td{padding:5px 6px}
 .card{padding:12px}
 .lg{margin:10px auto;padding:14px;gap:16px}.lg-form{order:-1;align-self:stretch}
 dialog{width:96%;padding:10px}
}
@media (max-width:420px){.ub{grid-template-columns:1fr}.chips{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}.hero h1{font-size:19px}}
@media (hover:none){.btn:hover{filter:none}}

html.nc,html.nc *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.nc input,html.nc textarea,html.nc select{-webkit-user-select:text;user-select:text}

.clkbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#14577a;color:#fff;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom));font-size:13px;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
.clkbar span{white-space:nowrap}.clkbar span:last-child{font-weight:800}
body{padding-bottom:52px}
.notice{flex:1 1 100%;background:#fff7e6;border:1px solid #e3cf9a;border-right:6px solid #d99a1e;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.nt-top{display:flex;gap:12px;align-items:center}
.nt-ic{color:#5c4306;display:flex;animation:ntpulse 1.6s ease-in-out infinite}
.nt-h{font-weight:800;font-size:16px;color:#5c4306}.nt-s{font-size:13px;color:#6b5a2a}
.ind{position:relative;height:10px;border-radius:5px;background:#f0e1b8;overflow:hidden}
.ind i{position:absolute;top:0;bottom:0;left:-35%;width:35%;border-radius:5px;background:#d99a1e;animation:ntind 1.3s linear infinite}
@keyframes ntind{0%{left:-35%}100%{left:100%}}
.ind.done i{left:0;width:100%;animation:none;background:#2e7d4f}
@keyframes ntpulse{0%,100%{opacity:1}50%{opacity:.4}}
.nt-d{display:flex;flex-wrap:wrap;gap:8px}.nt-d span{background:#fff;border:1px solid #e3cf9a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;color:#5c4306}
.nt-date{font-size:13.5px;color:#5c4306}
.nt-d span.ok{background:#dcecdc;border-color:#b9d3bf;color:#1d4a2c}
.nt-log{border-top:1px dashed #e3cf9a;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.nt-lh{font-weight:800;font-size:13.5px;color:#5c4306}
.nt-li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:#3d3012;line-height:1.7}
.nt-li b{flex:none;background:#fff;border:1px solid #e3cf9a;border-radius:6px;padding:0 8px;color:#5c4306}
@media (max-width:767px){.nt-li{flex-direction:column;gap:2px}}
.busy{position:fixed;inset:0;z-index:100;background:rgba(20,40,55,.45);display:none;align-items:center;justify-content:center;padding:16px}
.busy.on{display:flex}
.busy .bx{background:#fff;border-radius:12px;padding:22px 24px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center;font-weight:700;color:#14425f}
.busy .ind{margin-top:14px;background:#d6e6f4}.busy .ind i{background:#14577a}
@media print{.busy{display:none!important}}
.dlogos{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dl{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%;min-width:92px;max-width:150px;padding:8px 6px;border:2px solid #d3dde5;border-radius:10px;background:#fff;cursor:pointer;font:inherit;font-weight:700;font-size:12px;color:#14425f;min-height:44px}
.dl img{width:100%;height:72px;object-fit:contain}
.dl[aria-pressed=true]{border-color:#14577a;background:#eaf3f9}
@media (prefers-reduced-motion:reduce){.ind i{animation-duration:3.2s}.nt-ic{animation:none}}
@media (max-width:767px){.clkbar{font-size:12px;gap:2px 10px}body{padding-bottom:64px}}
@media print{.clkbar{display:none!important}}

/* ───── التقرير A4 ───── */
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;width:794px;height:1123px;overflow:hidden;background:#fff;font-family:'Tajawal','Segoe UI','SF Arabic','Noto Sans Arabic',Roboto,'Helvetica Neue',Tahoma,sans-serif;color:#16222d}
.sheet .bg{position:absolute;left:0;top:0;width:794px;height:1123px}
.sheet .wmbox{position:absolute;left:0;top:0;width:794px;height:1022px;overflow:hidden}
.sheet .wmbox img{position:absolute;left:57px;top:390px;width:680px;height:381px;opacity:.18}
.sheet .body{position:absolute;left:0;right:0;top:150px;height:860px;padding:0 64px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:800;line-height:1.3}
.sheet p{margin:0;font-size:12.5px;line-height:1.7;text-align:justify}
.sheet .g1{font-size:16px;font-weight:800}.sheet .g2{font-size:15px;font-weight:700}
.sheet .box{border:1px solid #9fb0bd;border-radius:6px;overflow:hidden}
.sheet .gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet .th{padding:6px 10px;text-align:center;font-size:14px;font-weight:800}
.sheet .td{min-height:32px;padding:5px 10px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;border-top:1px solid #9fb0bd}
.sheet .td+.td{border-right:1px solid #9fb0bd}
.sheet .tr1{padding:5px 12px;min-height:32px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;border-top:1px solid #9fb0bd}
.sheet .ft{text-align:center;font-size:14px;font-weight:800}
.sheet .dlogo{position:absolute;left:50%;top:60px;transform:translateX(-50%);max-height:80px;max-width:120px;object-fit:contain}
.sheet.en{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;text-align:left}
.sheet h2 .dt{display:block;font-size:15px;font-weight:700;margin-top:4px;color:#2b3b49}
.sheet.en h2{font-size:22px}
.sheet.en p{font-size:12px;line-height:1.6}
.sheet.en .td+.td{border-right:0;border-left:1px solid #9fb0bd}
#printArea{display:none}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}#app{display:none}
 #printArea{display:block}
 .sheet{break-after:page;margin:0}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<dialog id="zoomDlg"><div id="zoomBody" style="overflow:auto;max-height:82vh;max-width:100%;-webkit-overflow-scrolling:touch"></div><form method="dialog" style="margin-top:12px"><button class="btn">إغلاق</button></form></dialog>
