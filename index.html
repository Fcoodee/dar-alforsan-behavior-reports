<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>تقارير الأداء السلوكي والأكاديمي — دار الفرسان (نسخة تجريبية)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16222d;--mut:#4a5b69;--line:#d3dce3;--bg:#eef2f5;--pri:#1b6a96;--ok:#1d4a2c;--warn:#5c4306;--info:#123a5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#app{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
header.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:21px;font-weight:800}
.sub{color:var(--mut);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.c1{flex:1 1 300px;max-width:360px;min-width:270px;display:flex;flex-direction:column;gap:12px}
.c2{flex:1 1 380px;max-width:470px;min-width:300px;display:flex;flex-direction:column;gap:12px}
.c3{flex:999 1 640px;min-width:300px;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #9fb0bd;background:#fff;font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.chip{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;border:1px solid #9fb0bd;background:#fff;padding:2px 4px}
.chip b{font-size:15px}.chip small{font-size:12px}
.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.list{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.st{min-height:48px;text-align:right;border-radius:8px;border:1px solid #c3cfd8;background:#fff;padding:6px 12px;display:flex;flex-direction:column}
.st.sel{background:#d6e6f4;border-color:var(--pri)}
.st small{color:#3d4e5c;font-size:12.5px}
fieldset{margin:0;border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
legend{font-weight:800;padding:0 6px;font-size:14px}
.fs-s{border:1px solid #b9d3bf;background:#f6fbf7}.fs-s legend{color:var(--ok)}
.fs-i{border:1px solid #e3cf9a;background:#fffaf0}.fs-i legend{color:var(--warn)}
.fs-r{border:1px solid #b4cde3;background:#f4f9fd}.fs-r legend{color:var(--info)}
.opts{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px}
label.o{min-height:36px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:4px 2px}
label.o input{width:18px;height:18px;margin-top:2px;flex:none}
.add{display:flex;gap:8px}.add input{flex:1;min-width:0;min-height:44px;border:1px solid #9fb0bd;border-radius:8px;padding:0 12px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#e3eaf0}
.b-DRAFT{background:#e3eaf0}.b-SUBMITTED{background:#fbecc8;color:var(--warn)}.b-REVIEWED{background:#d6e6f4;color:var(--info)}.b-APPROVED{background:#dcecdc;color:var(--ok)}.b-PUBLISHED{background:#1d4a2c;color:#fff}
.bar{height:10px;border-radius:5px;background:#dbe4ea;overflow:hidden}.bar i{display:block;height:10px;background:var(--pri)}
#msg{min-height:22px;font-size:13.5px;font-weight:700}
#msg.err{color:#a02020}#msg.ok{color:var(--ok)}
.wrap{width:100%;overflow-x:auto;display:flex;justify-content:center}
.scaled{position:relative;flex:none;width:620px;height:876px;box-shadow:0 2px 14px rgba(22,34,45,.25);background:#fff}
.scaled .sheet{position:absolute;top:0;right:0;transform:scale(.78);transform-origin:top right}
dialog{border:1px solid var(--line);border-radius:10px;max-width:760px;width:92%}
table.au{border-collapse:collapse;width:100%;font-size:12.5px}table.au td,table.au th{border:1px solid var(--line);padding:4px 8px;text-align:right}


header.hero{position:relative;overflow:hidden;border-radius:14px;background:#14577a;color:#fff;padding:20px 24px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;border-bottom:6px solid #7cc4e4}
header.hero .emb{position:absolute;left:-40px;bottom:-70px;width:520px;opacity:.1;pointer-events:none}
header.hero>*{position:relative}header.hero>.emb{position:absolute}
.hero .logo{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:center}
.hero .logo img{width:112px;height:94px;object-fit:contain}
.hero .tt{display:flex;flex-direction:column;gap:8px;flex:1 1 320px}
.hero h1{font-size:28px;color:#fff}
.hero .chip2{display:inline-block;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45)}
.hero .chip2.w{background:#fff;color:#14577a;font-weight:800;border-color:#fff}
.hero .sub2{font-size:14.5px;color:#d6ecf7}
.hero .prog{display:flex;flex-direction:column;gap:8px;min-width:260px;flex:0 1 340px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px}
.hero .prog .bar{background:rgba(255,255,255,.28)}.hero .prog .bar i{background:#bfe6f7}
.hero .clk{display:flex;flex-wrap:wrap;gap:8px 10px;font-size:13.5px}
.hero .clk span{background:rgba(0,0,0,.22);border-radius:8px;padding:4px 12px}
.hero .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero .ctl .badge{background:rgba(255,255,255,.2);color:#fff}
.hero .ctl select,.hero .ctl .btn{color:var(--ink)}
.hero .ctl label{color:#d6ecf7}


.ub{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.uc{text-align:right;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.uc.sel{border-color:var(--pri);box-shadow:0 0 0 2px #1b6a9633;background:#eaf3f9}
.uc .un{font-weight:800;font-size:14px}.uc .ur{font-size:12px;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pl{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid #c3cfd8;background:#f4f7f9}
.pl b{font-size:13px}.pl.ok{background:#dcecdc;border-color:#b9d3bf;color:#1d4a2c}.pl.act{background:#fbecc8;border-color:#e3cf9a;color:#5c4306}
.dash{display:flex;flex-direction:column;gap:10px}.dmsg{margin:0;font-size:15px}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}.dt th,.dt td{border:1px solid var(--line);padding:6px 10px;text-align:center}.dt thead th{background:#eef3f6}.dt tbody th{text-align:right;background:#f7f9fa}.dt tr.tot td,.dt tr.tot th{font-weight:800;background:#eef3f6}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e3eaf0}.sbar i{display:block;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}

.lg{max-width:860px;margin:48px auto;display:flex;flex-wrap:wrap;gap:24px;border-top:6px solid #14577a;padding:22px}
.lg-info{flex:1 1 380px;display:flex;flex-direction:column;gap:12px}
.lg-form{flex:1 1 280px;display:flex;flex-direction:column;gap:10px;background:#f4f8fb;border:1px solid var(--line);border-radius:12px;padding:16px}
.lg-form{align-self:flex-start}.lg-form label{display:flex;flex-direction:column;gap:6px}
.lg-p{margin:0;line-height:1.9;font-size:14.5px}.lg-h{font-weight:800;font-size:14px;color:#14577a;border-bottom:1px solid var(--line);padding-bottom:4px}
.rl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.7}.rt{align-self:flex-start;border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px}
/* ───── التقرير A4 ───── */
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;width:794px;height:1123px;overflow:hidden;background:#fff;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:#16222d}
.sheet .bg{position:absolute;left:0;top:0;width:794px;height:1123px}
.sheet .wmbox{position:absolute;left:0;top:0;width:794px;height:1022px;overflow:hidden}
.sheet .wmbox img{position:absolute;left:57px;top:390px;width:680px;height:381px;opacity:.18}
.sheet .body{position:absolute;left:0;right:0;top:150px;height:860px;padding:0 64px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:800;line-height:1.3}
.sheet p{margin:0;font-size:12.5px;line-height:1.7;text-align:justify}
.sheet .g1{font-size:16px;font-weight:800}.sheet .g2{font-size:15px;font-weight:700}
.sheet .box{border:1px solid #9fb0bd;border-radius:6px;overflow:hidden}
.sheet .gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet .th{padding:6px 10px;text-align:center;font-size:14px;font-weight:800}
.sheet .td{min-height:32px;padding:5px 10px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;border-top:1px solid #9fb0bd}
.sheet .td+.td{border-right:1px solid #9fb0bd}
.sheet .tr1{padding:5px 12px;min-height:32px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;border-top:1px solid #9fb0bd}
.sheet .ft{text-align:center;font-size:14px;font-weight:800}
#printArea{display:none}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}#app{display:none}
 #printArea{display:block}
 .sheet{break-after:page;margin:0}
 @page{size:A4;margin:0}
}
</style>

<body>
<div id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<dialog id="auditDlg"><div id="auditBody"></div><form method="dialog" style="margin-top:12px"><button class="btn">إغلاق</button></form></dialog>
<script src="data.js"></script>
<script src="access.js"></script>
<script>
'use strict';
/* ═════════ قواعد العمل (مطابقة لـ apps-script/Code.gs) ═════════ */
const MAX={strength:4,improve:4,recommend:3}, MAXC=120;
const CATS=['strength','improve','recommend'];
const STAGE_AR={primary:'الابتدائي',middle:'المتوسط',secondary:'الثانوي',all:'كل المراحل'};
const ROLE_AR={counselor:'موجه طلابي',deputy:'وكيل شؤون الطلاب',principal:'مدير المدرسة',admin:'مدير النظام'};
const ST_AR={NONE:'لم يبدأ',DRAFT:'مسودة',SUBMITTED:'بانتظار الوكيل',REVIEWED:'بانتظار المدير',APPROVED:'معتمد',PUBLISHED:'منشور'};
const TRANS={
 DRAFT:{SUBMITTED:['counselor','deputy','admin']},
 SUBMITTED:{REVIEWED:['deputy','admin'],DRAFT:['deputy','principal','admin']},
 REVIEWED:{APPROVED:['principal','admin'],DRAFT:['deputy','principal','admin']},
 APPROVED:{PUBLISHED:['principal','admin'],DRAFT:['principal','admin']},
 PUBLISHED:{DRAFT:['principal','admin']}};
const stagesOf=c=>c.stages||String(c.stage).split('+');
const canSee=(c,stage)=>['principal','admin'].includes(c.role)||stagesOf(c).includes('all')||stagesOf(c).includes(stage);

/* ═════════ واجهة الخلفية: محاكاة محلية، أو Apps Script إن وُجد ═════════ */
const Mock=(()=>{
 const KEY='dfa_demo_v1';
 let db; try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){} db=db||{reports:{},audit:[]};
 let ctx=null;
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
 const log=(a,t,d)=>{db.audit.push({ts:new Date().toISOString(),email:ctx.email,action:a,target:t,detail:d||''});save();};
 const stu=id=>{const s=DEMO.students.find(x=>x.id===id);if(!s||!canSee(ctx,s.stage))throw new Error('الطالب غير متاح.');return s;};
 const wait=v=>new Promise(r=>setTimeout(()=>r(JSON.parse(JSON.stringify(v))),60));
 const fail=e=>Promise.resolve().then(()=>{throw e});
 return{
  isMock:true,
  users:()=>[],
  as(u){ctx=u;return wait(ctx);},
  me:()=>wait(ctx),
  students(){return wait(DEMO.students.filter(s=>canSee(ctx,s.stage)).map(s=>({...s,status:(db.reports[s.id]||{}).status||'NONE'})));},
  library:()=>wait(DEMO.library),
  getReport(id){try{stu(id);}catch(e){return fail(e)}const r=db.reports[id];return wait(r?{id:'R-'+id,status:r.status,items:r.items,pdfUrl:r.pdfUrl||''}:{status:'NONE',items:[]});},
  saveReport(id,items){try{
   stu(id);const r=db.reports[id];
   if(r&&r.status!=='DRAFT')throw new Error('التقرير مقفل بحالته الحالية.');
   if(!['counselor','deputy','admin'].includes(ctx.role))throw new Error('لا صلاحية للتعديل.');
   const lib=new Set(DEMO.library.map(l=>l.text)),n={strength:0,improve:0,recommend:0};
   const clean=items.map((it,i)=>{const t=String(it.text||'').trim();if(!t)throw new Error('عبارة فارغة.');if(!CATS.includes(it.category))throw new Error('فئة غير صالحة.');
    const source=lib.has(t)?'library':'custom';if(source==='custom'&&t.length>MAXC)throw new Error('العبارة المخصصة أطول من '+MAXC+' حرفاً.');
    if(++n[it.category]>MAX[it.category])throw new Error('تجاوز الحد الأقصى للفئة.');return{category:it.category,text:t,source};});
   db.reports[id]={status:'DRAFT',items:clean,by:ctx.email,updated:new Date().toISOString()};log('SAVE','R-'+id,clean.length+' بنود');
   return wait({id:'R-'+id,status:'DRAFT'});}catch(e){return fail(e)}},
  transition(id,to,reason){try{
   stu(id);const r=db.reports[id];if(!r)throw new Error('لا يوجد تقرير.');
   const ok=(TRANS[r.status]||{})[to];if(!ok||!ok.includes(ctx.role))throw new Error('هذه النقلة غير مسموحة لدورك.');
   if(to==='DRAFT'&&!String(reason||'').trim())throw new Error('سبب الإعادة مطلوب.');
   if(to==='SUBMITTED'){const g={strength:0,improve:0,recommend:0};r.items.forEach(i=>g[i.category]++);if(!g.strength||!g.improve||!g.recommend)throw new Error('أكمل نقطة قوة وتحسين وتوصية على الأقل.');}
   const from=r.status;r.status=to;if(to==='REVIEWED')r.reviewedBy=ctx.email;if(to==='APPROVED')r.approvedBy=ctx.email;
   if(to==='PUBLISHED')r.pdfUrl='https://drive.example.test/demo/'+id+'.pdf (رابط تجريبي، محاكاة)';
   r.updated=new Date().toISOString();log('TRANSITION','R-'+id,from+' -> '+to+(reason?' | '+reason:''));
   return wait({status:to,pdfUrl:r.pdfUrl||''});}catch(e){return fail(e)}},
  stats(){const o={};['primary','middle','secondary'].forEach(k=>o[k]={total:0,NONE:0,DRAFT:0,SUBMITTED:0,REVIEWED:0,APPROVED:0,PUBLISHED:0});
   DEMO.students.forEach(s=>{const k=(db.reports[s.id]||{}).status||'NONE';o[s.stage].total++;o[s.stage][k]++;});return wait({stages:o});},
  audit:()=>wait(db.audit.slice(-60).reverse()),
  reset(){db={reports:{},audit:[]};save();}
 };
})();
const Gas=(()=>{ // يُستخدم داخل Apps Script الحقيقي
 const call=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))[fn](...a));
 return{isMock:false,users:()=>[],as:()=>call('api_me'),me:()=>call('api_me'),students:()=>call('api_students'),library:()=>call('api_library'),
  getReport:id=>call('api_getReport',id),saveReport:(id,i)=>call('api_saveReport',id,i),transition:(id,t,r)=>call('api_transition',id,t,r),audit:async()=>[],stats:()=>call('api_stats'),reset(){}};
})();
const B=(typeof google!=='undefined'&&google.script)?Gas:Mock;

/* ═════════ الحالة والواجهة ═════════ */
const S={user:null,students:[],lib:[],cls:null,cur:null,items:[],status:'NONE',pdfUrl:'',q:'',msg:'',msgKind:'',reason:'',drafts:{strength:'',improve:'',recommend:''},printScope:'student',stats:null,filter:'all'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=c=>'<bdi dir="ltr">'+esc(c)+'</bdi>';
const fmtDate=(loc,o)=>{try{return new Intl.DateTimeFormat(loc,Object.assign({timeZone:'Asia/Riyadh'},o)).format(new Date());}catch(e){return '';}};
function clockHtml(){return '<span>'+fmtDate('ar-SA-u-ca-islamic-umalqura-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span><span>الموافق '+fmtDate('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'})+'م</span><span style="font-weight:800">'+fmtDate('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',hour12:true})+'</span>';}
setInterval(()=>{const c=document.getElementById('clk');if(c)c.innerHTML=clockHtml();},20000);

/* ───── المتابعة وفاعلية العمل ───── */
const STG=['primary','middle','secondary'];
const stagesFor=u=>(['principal','admin'].includes(u.role)||stagesOf(u).includes('all'))?STG:stagesOf(u).filter(x=>STG.includes(x));
const stageLabel=u=>stagesFor(u).length===3?'كل المراحل':stagesFor(u).map(x=>STAGE_AR[x]).join(' + ');
function agg(stats,stages){const a={total:0,NONE:0,DRAFT:0,SUBMITTED:0,REVIEWED:0,APPROVED:0,PUBLISHED:0};
 stages.forEach(s=>{const x=stats&&stats.stages&&stats.stages[s];if(x)for(const k in a)a[k]+=x[k]||0;});return a;}
const sent=a=>a.SUBMITTED+a.REVIEWED+a.APPROVED+a.PUBLISHED;
const depOk=a=>a.REVIEWED+a.APPROVED+a.PUBLISHED;
const finOk=a=>a.APPROVED+a.PUBLISHED;
function badgesFor(u){const a=agg(S.stats,stagesFor(u));
 if(u.role==='counselor')return[['أُرسل',sent(a),'ok'],['متبقٍ',a.total-sent(a),'rem']];
 if(u.role==='deputy')return[['بانتظارك',a.SUBMITTED,'act'],['متبقٍ للاعتماد',a.total-depOk(a),'rem']];
 if(u.role==='principal')return[['مرسَل',sent(a),'ok'],['معتمد',finOk(a),'ok'],['بانتظارك',a.REVIEWED,'act']];
 return[['الطلاب',a.total,'rem']];}
const todoSt=u=>u.role==='deputy'?['SUBMITTED']:u.role==='principal'?['REVIEWED']:['NONE','DRAFT'];
function usersBarHtml(){
 if(!B.isMock||!['principal','admin'].includes(S.user.role)||!window.TEAM||!window.TEAM.length)return '';
 return '<div class="card"><div class="sub" style="margin-bottom:8px">فريق العمل — أرقام المتابعة لكل دور (تظهر لك بصفتك مديراً):</div><div class="ub">'+
  window.TEAM.map(x=>'<div class="uc"><span class="un">'+esc(x.name)+'</span><span class="ur">'+ROLE_AR[x.role]+' · '+stageLabel(x)+'</span><span class="pills">'+
   badgesFor(x).map(b=>'<span class="pl '+b[2]+'"><b>'+b[1]+'</b> '+b[0]+'</span>').join('')+'</span></div>').join('')+'</div></div>';}
function maintHtml(){
 if(S.user.role!=='admin')return '';
 const a=agg(S.stats,STG);
 return '<section class="card" style="border-right:5px solid #5c4306"><h2 style="margin:0 0 8px;font-size:17px">ملاحظات الصيانة (لمهندس النظام فقط)</h2><ul style="margin:0;padding-inline-start:20px;line-height:1.9;font-size:13.5px">'+
  '<li>وضع التشغيل: '+(B.isMock?'محاكاة محلية تُخزَّن في متصفح هذا الجهاز (localStorage)؛ البيانات افتراضية بالكامل.':'متصل بالشيت عبر Apps Script.')+'</li>'+
  '<li>الدخول: قفل متصفح يقرأ access.txt (PBKDF2). لا يحمي بيانات حقيقية؛ الإنتاج بحسابات Google عبر Apps Script.</li>'+

/* ───── بوابة الدخول (access.txt) ───── */
const Auth=(()=>{
 const SK='dfa_sess_v1',TK='dfa_try_v1',TTL=3600e3,MAXT=5,LOCKMS=60e3;let entries=[];
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const sha=async t=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));
 const parse=txt=>txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&l[0]!=='#').map(l=>{const p=l.split(',');return{u:p[0],secret:p[1],role:p[2],stage:p[3],name:p.slice(4).join(',')||p[0]};}).filter(e=>e.u&&e.secret&&ROLE_AR[e.role]&&e.stage);
 const mk=e=>({username:e.u,name:e.name,role:e.role,stage:e.stage,stages:e.stage.split('+'),email:e.u+'('+e.role+'/'+e.stage+')'});
 async function load(){let t='';try{const r=await fetch('access.txt',{cache:'no-store'});if(r.ok)t=await r.text();}catch(e){}
  if(!t&&window.ACCESS_TXT)t=window.ACCESS_TXT;entries=parse(t);
  const seen={};window.TEAM=entries.filter(e=>{const k=e.role+'|'+e.stage;if(seen[k])return false;seen[k]=1;return true;}).map(mk);}
 async function pbk(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:it},k,256));}
 async function ok(e,pw){const p=e.secret.split(':');if(p[0]==='pbkdf2')return (await pbk(pw,p[2],+p[1]))===p[3];if(p[0]==='sha256')return (await sha(p[1]+':'+pw))===p[2];return false;}
 const tries=()=>{try{return JSON.parse(localStorage.getItem(TK)||'{}');}catch(x){return {};}};
 const setT=o=>{try{localStorage.setItem(TK,JSON.stringify(o));}catch(x){}};
 async function login(u,pw){
  if(!entries.length)return{err:'تعذّر قراءة ملف الصلاحيات access.txt؛ الدخول مقفل.'};
  const t=tries();if(t.until&&t.until>Date.now())return{err:'محاولات كثيرة. حاول بعد '+Math.ceil((t.until-Date.now())/1000)+' ثانية.'};
  for(const e of entries.filter(x=>x.u===u)){if(await ok(e,pw)){setT({});const user=mk(e);try{sessionStorage.setItem(SK,JSON.stringify({user,exp:Date.now()+TTL}));}catch(x){}return{user};}}
  const n=(t.n||0)+1;setT(n>=MAXT?{until:Date.now()+LOCKMS,n:0}:{n});return{err:'بيانات الدخول غير صحيحة.'};}
 function session(){try{const o=JSON.parse(sessionStorage.getItem(SK)||'null');if(o&&o.exp>Date.now())return o.user;}catch(e){}return null;}
 function logout(){try{sessionStorage.removeItem(SK);}catch(e){}location.reload();}
 return{load,login,session,logout};
})();

  actionsHtml()+'<div id="msg" role="status" class="'+S.msgKind+'">'+esc(S.msg)+'</div>':'<div class="sub">اختر طالباً.</div>')+'</section>'+
 '<section class="c3"><div class="card" style="width:100%;max-width:640px"><div class="row"><button class="btn pri" id="print">طباعة / حفظ PDF</button>'+
  '<label class="sub">النطاق <select id="scope" style="min-height:44px;border:1px solid #9fb0bd;border-radius:8px;padding:0 8px"><option value="student"'+(S.printScope==='student'?' selected':'')+'>الطالب الحالي</option><option value="class"'+(S.printScope==='class'?' selected':'')+'>فصل '+(S.cls||'')+' (المعتمد/المنشور)</option></select></label>'+
  (B.isMock&&['principal','admin'].includes(S.user.role)?'<button class="btn" id="audit">سجل التدقيق</button>':'')+'</div>'+
  (S.pdfUrl?'<div class="sub" style="margin-top:6px">رابط الـ PDF: '+esc(S.pdfUrl)+'</div>':'')+'</div>'+
  '<div class="wrap"><div class="scaled"><div class="sheet-host" id="host"></div></div></div></section></div>';
 const host=$('#host');
 if(host&&stu){host.outerHTML=sheetHtml(stu.name,S.items).replace('class="sheet"','class="sheet"');}
 else if(host){host.remove();}
 const sh=$('.scaled .sheet');if(sh){sh.style.position='absolute';}
 bind();
}
function bind(){
 const app=$('#app');
 app.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{S.q='';S.filter='all';S.cls=b.dataset.cls;const f=S.students.find(s=>s.class===S.cls);f?pick(f.id):render();});
 app.querySelectorAll('[data-stu]').forEach(b=>b.onclick=()=>pick(b.dataset.stu));
 app.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>toggle(c.dataset.cat,c.dataset.t));
 app.querySelectorAll('form[data-add]').forEach(f=>f.onsubmit=e=>{e.preventDefault();addCustom(f.dataset.add);});
 app.querySelectorAll('input[data-draft]').forEach(i=>i.oninput=()=>{S.drafts[i.dataset.draft]=i.value;});
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 const r=$('#reason');if(r)r.oninput=()=>{S.reason=r.value;};
 const q=$('#q');if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};
 const lo=$('#logout');if(lo)lo.onclick=Auth.logout;
 app.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.flt;render();});
 const rs=$('#reset');if(rs)rs.onclick=async()=>{B.reset();await loadAll();S.cur=null;S.items=[];S.status='NONE';render();const f=S.students.find(s=>s.class===S.cls);if(f)await pick(f.id);};
 const sc=$('#scope');if(sc)sc.onchange=()=>{S.printScope=sc.value;};
 const pr=$('#print');if(pr)pr.onclick=doPrint;
 const au=$('#audit');if(au)au.onclick=async()=>{const rows=await B.audit();$('#auditBody').innerHTML='<h3>سجل التدقيق (آخر 60)</h3><table class="au"><tr><th>الوقت</th><th>الحساب</th><th>الإجراء</th><th>الهدف</th><th>تفصيل</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.ts.slice(0,19).replace('T',' '))+'</td><td>'+esc(x.email)+'</td><td>'+x.action+'</td><td>'+esc(x.target)+'</td><td>'+esc(x.detail)+'</td></tr>').join('')+'</table>';$('#auditDlg').showModal();};
}
async function doPrint(){
 const pa=$('#printArea');let html='';
 if(S.printScope==='class'){
  const ids=S.students.filter(s=>s.class===S.cls&&['APPROVED','PUBLISHED'].includes(s.status));
  if(!ids.length){say('لا تقارير معتمدة أو منشورة في هذا الفصل.','err');return;}
  for(const s of ids){const r=await B.getReport(s.id);html+=sheetHtml(s.name,r.items||[]);}
 }else{const s=curStudent();if(!s)return;html=sheetHtml(s.name,S.items);}
 pa.innerHTML=html;
 setTimeout(()=>{try{window.print();}catch(e){say('الطباعة غير متاحة هنا.','err');}},150);
}
boot().catch(e=>{document.body.insertAdjacentHTML('afterbegin','<p style="padding:16px;color:#a02020">خطأ في التشغيل: '+esc(e.message)+'</p>');});
</script>
</body>
</html>
